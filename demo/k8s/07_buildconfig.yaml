apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: edge-triage-engine
  labels:
    app.kubernetes.io/name: edge-data-triage
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: edge-triage-builder
  labels:
    app.kubernetes.io/name: edge-data-triage
spec:
  runPolicy: Serial
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: edge-triage-engine:latest
