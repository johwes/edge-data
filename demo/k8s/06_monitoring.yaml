# OpenShift User Workload Monitoring configuration
# Note: Ensure User Workload Monitoring is enabled in openshift-monitoring:
#   oc get configmap cluster-monitoring-config -n openshift-monitoring -o yaml
#   (data.config.yaml: enableUserWorkload: true)
apiVersion: v1
kind: Service
metadata:
  name: edge-triage-metrics
  labels:
    app.kubernetes.io/name: edge-data-triage
    app.kubernetes.io/component: triage-worker
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: edge-data-triage
    app.kubernetes.io/component: triage-worker
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: edge-triage-monitor
  labels:
    app.kubernetes.io/name: edge-data-triage
    app.kubernetes.io/component: triage-worker
spec:
  endpoints:
    - port: metrics
      interval: 10s
      scrapeTimeout: 8s
      path: /metrics
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-data-triage
      app.kubernetes.io/component: triage-worker
---
# Production Security Note:
# This demo Route is unauthenticated for zero-friction stakeholder presentation.
# For production edge clusters, gate external access using:
#   1. OpenShift OAuth Proxy (oauth-proxy sidecar) or OpenShift Ingress mTLS
#   2. kube-rbac-proxy for /metrics endpoint RBAC enforcement
#   3. NetworkPolicy restricting port 8080 ingress to authorized operations subnets
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: edge-triage-dashboard
  labels:
    app.kubernetes.io/name: edge-data-triage
    app.kubernetes.io/component: triage-worker
spec:
  to:
    kind: Service
    name: edge-triage-metrics
  port:
    targetPort: metrics
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

