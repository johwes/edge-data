# ==============================================================================
# OPTIONAL: NetApp Astra Trident Storage Configuration
# ==============================================================================
# Apply this file ONLY if your cluster has the NetApp Astra Trident CSI Operator
# installed and is connected to a NetApp ONTAP storage system (on-prem AFF/FAS,
# Cloud Volumes ONTAP, or AWS FSx for NetApp ONTAP).
#
# FOR PUBLIC CLOUD OPENSHIFT (AWS ROSA, Azure ARO, GCP OCP):
# SKIP THIS FILE COMPLETELY. Proceed directly to 02_persistent_volumes.yaml.
# ==============================================================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-nas
  labels:
    app.kubernetes.io/name: edge-data-triage
    storage.netapp.io/tier: high-throughput-file
provisioner: csi.trident.netapp.io
parameters:
  backendType: "ontap-nas"
  media: "ssd"
  provisioningType: "thin"
  snapshots: "true"
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - noatime
  - nodiratime
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-san
  labels:
    app.kubernetes.io/name: edge-data-triage
    storage.netapp.io/tier: high-iops-block
provisioner: csi.trident.netapp.io
parameters:
  backendType: "ontap-san"
  media: "ssd"
  provisioningType: "thin"
  fsType: "ext4"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: netapp-snapshot-class
  labels:
    app.kubernetes.io/name: edge-data-triage
driver: csi.trident.netapp.io
deletionPolicy: Delete
---
# Astra Trident Backend Secret Template
apiVersion: v1
kind: Secret
metadata:
  name: ontap-backend-secret
  namespace: trident
  labels:
    app.kubernetes.io/name: edge-data-triage
type: Opaque
stringData:
  username: "admin"
  password: "NetAppPassword123!"
---
# Astra Trident Backend Configuration (CRD)
apiVersion: trident.netapp.io/v1
kind: TridentBackendConfig
metadata:
  name: ontap-nas-backend
  namespace: trident
  labels:
    app.kubernetes.io/name: edge-data-triage
spec:
  version: 1
  storageDriverName: ontap-nas
  managementLIF: "10.240.10.101"
  dataLIF: "10.240.10.105"
  svm: "svm_edge_triage"
  credentials:
    name: ontap-backend-secret
  storagePrefix: "edge_"
  autoExportPolicy: true
