apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-nas
  labels:
    app.kubernetes.io/name: edge-data-triage
    storage.netapp.io/tier: high-throughput-file
provisioner: csi.trident.netapp.io
parameters:
  backendType: "ontap-nas"
  media: "ssd"
  provisioningType: "thin"
  snapshots: "true"
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.1
  - noatime
  - nodiratime
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ontap-san
  labels:
    app.kubernetes.io/name: edge-data-triage
    storage.netapp.io/tier: high-iops-block
provisioner: csi.trident.netapp.io
parameters:
  backendType: "ontap-san"
  media: "ssd"
  provisioningType: "thin"
  fsType: "ext4"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: netapp-snapshot-class
  labels:
    app.kubernetes.io/name: edge-data-triage
driver: csi.trident.netapp.io
deletionPolicy: Delete
