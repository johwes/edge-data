apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-telemetry-simulator
  namespace: edge-triage
  labels:
    app.kubernetes.io/name: edge-data-triage
    app.kubernetes.io/component: simulator
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-data-triage
        app.kubernetes.io/component: simulator
    spec:
      restartPolicy: Never
      serviceAccountName: edge-triage-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: image-registry.openshift-image-registry.svc:5000/edge-triage/edge-triage-engine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: raw-ingest-volume
              mountPath: /mnt/raw_ingest
            - name: tmp-volume
              mountPath: /tmp
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: RAW_INGEST_PATH
              value: "/mnt/raw_ingest"
            - name: SIMULATOR_EVENT_COUNT
              value: "100"
            - name: SIMULATOR_PAYLOAD_KB
              value: "1024"
          command:
            - python3
            - -m
            - simulator.generator
      volumes:
        - name: raw-ingest-volume
          persistentVolumeClaim:
            claimName: raw-ingest-pvc
        - name: tmp-volume
          emptyDir: {}
