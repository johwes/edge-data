apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-triage-sa
  labels:
    app.kubernetes.io/name: edge-data-triage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: edge-triage-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: edge-triage-reader-binding
subjects:
  - kind: ServiceAccount
    name: edge-triage-sa
roleRef:
  kind: Role
  name: edge-triage-reader
  apiGroup: rbac.authorization.k8s.io
