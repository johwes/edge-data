apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-triage-worker
  namespace: edge-triage
  labels:
    app.kubernetes.io/name: edge-data-triage
    app.kubernetes.io/component: triage-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-data-triage
      app.kubernetes.io/component: triage-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-data-triage
        app.kubernetes.io/component: triage-worker
    spec:
      serviceAccountName: edge-triage-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triage-worker
          # Use image built via OpenShift BuildConfig or local container registry
          image: image-registry.openshift-image-registry.svc:5000/edge-triage/edge-triage-engine:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: raw-ingest-volume
              mountPath: /mnt/raw_ingest
            - name: gds-curated-volume
              mountPath: /mnt/gds_curated
            - name: triage-config-volume
              mountPath: /etc/triage-config
              readOnly: true
            - name: cache-volume
              mountPath: /var/cache/usearch
            - name: tmp-volume
              mountPath: /tmp
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CONFIG_PATH
              value: "/etc/triage-config/triage_policy.yaml"
            - name: RAW_INGEST_PATH
              value: "/mnt/raw_ingest"
            - name: GDS_CURATED_PATH
              value: "/mnt/gds_curated"
            - name: METRICS_PORT
              value: "8080"
          command:
            - python3
            - -m
            - triage_engine.main
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: raw-ingest-volume
          persistentVolumeClaim:
            claimName: raw-ingest-pvc
        - name: gds-curated-volume
          persistentVolumeClaim:
            claimName: gds-curated-pvc
        - name: triage-config-volume
          configMap:
            name: triage-policy
        - name: cache-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
