apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-triage-worker
  labels:
    app.kubernetes.io/name: edge-data-triage
    app.kubernetes.io/component: triage-worker
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"edge-triage-engine:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"triage-worker\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-data-triage
      app.kubernetes.io/component: triage-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-data-triage
        app.kubernetes.io/component: triage-worker
    spec:
      serviceAccountName: edge-triage-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triage-worker
          image: edge-triage-engine:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: raw-ingest-volume
              mountPath: /mnt/raw_ingest
            - name: gds-curated-volume
              mountPath: /mnt/gds_curated
            - name: triage-config-volume
              mountPath: /etc/triage-config
              readOnly: true
            - name: cache-volume
              mountPath: /var/cache/usearch
            - name: tmp-volume
              mountPath: /tmp
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: CONFIG_PATH
              value: "/etc/triage-config/triage_policy.yaml"
            - name: RAW_INGEST_PATH
              value: "/mnt/raw_ingest"
            - name: GDS_CURATED_PATH
              value: "/mnt/gds_curated"
            - name: METRICS_PORT
              value: "8080"
            - name: VIDEO_STREAM_COPY
              value: "false"  # Set to "true" for zero-CPU stream-copy (-c copy) on keyframe boundaries
          envFrom:
            - secretRef:
                name: edge-triage-vlm-secret
                optional: true
          command:
            - python3
            - -m
            - triage_engine.main
          startupProbe:
            exec:
              command:
                - python3
                - -c
                - "import os, sys; sys.exit(0 if os.path.exists('/tmp/healthy') else 1)"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os, time, sys; sys.exit(0 if (time.time() - os.path.getmtime('/tmp/healthy')) < 30 else 1)"
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os, time, sys; sys.exit(0 if (time.time() - os.path.getmtime('/tmp/healthy')) < 30 else 1)"
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: raw-ingest-volume
          persistentVolumeClaim:
            claimName: raw-ingest-pvc
        - name: gds-curated-volume
          persistentVolumeClaim:
            claimName: gds-curated-pvc
        - name: triage-config-volume
          configMap:
            name: triage-policy
        - name: cache-volume
          emptyDir: {}  # In production, replace with an RWO PVC to preserve learned USearch novelty vectors across pod rescheduling
        - name: tmp-volume
          emptyDir: {}
