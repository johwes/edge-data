# Persistent Volume Claims for Edge Data Triage Demo
# DECOUPLED STORAGE CONTRACT:
# The Deployment (04) and Simulator Job (05) strictly reference these PVCs by claimName:
#   - raw-ingest-pvc
#   - gds-curated-pvc
#
# CLOUD & ON-PREM PORTABILITY:
# By default, 'storageClassName' is omitted below so Kubernetes automatically binds to your
# cluster's default StorageClass (e.g. AWS GP3/EFS on ROSA, Azure Disk/Files on ARO, or on-prem).
#
# If you wish to target a specific StorageClass, uncomment 'storageClassName' and set:
#   - NetApp ONTAP / Astra Trident (On-prem / Cloud Volumes ONTAP / AWS FSx): "ontap-nas"
#   - AWS ROSA / EFS CSI: "efs-sc"
#   - Azure ARO / Azure Files: "azurefile-csi"
#   - GCP OCP / Filestore: "standard-rwx"
#
# SIZING NOTE FOR CLOUD ENVIRONMENTS:
# Default sizing is set to a lean, cloud-cost-optimized allocation (10Gi raw / 5Gi curated).
# This comfortably handles multiple 100-event demo runs (~105 MB raw, ~3 MB curated)
# without incurring expensive 100s of GiB cloud provisioning fees.
# (Production 10-truck haul cells deploy 30–50 TB/day rolling NVMe rings on NetApp AFF/FAS).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: raw-ingest-pvc
  labels:
    app.kubernetes.io/name: edge-data-triage
    storage.edge.io/tier: raw-ingest
    scale: lean-cloud-demo
  annotations:
    description: "Rolling ingest ring buffer for raw multi-modal vehicle MCAP telemetry."
spec:
  accessModes:
    - ReadWriteMany
  # storageClassName: ""  # Omit to bind to cluster default RWX class, or specify:
  #   - "efs-sc"          # AWS ROSA / EFS CSI
  #   - "azurefile-csi"   # Azure ARO
  #   - "standard-rwx"    # GCP Filestore / ODF
  #   - "ontap-nas"       # NetApp Astra Trident
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gds-curated-pvc
  labels:
    app.kubernetes.io/name: edge-data-triage
    storage.edge.io/tier: gds-curated
    scale: lean-cloud-demo
  annotations:
    description: "Curated Golden Data Set output pool for decimated candidate events."
spec:
  accessModes:
    - ReadWriteMany
  # storageClassName: ""  # Omit to bind to cluster default RWX class, or specify:
  #   - "efs-sc"          # AWS ROSA / EFS CSI
  #   - "azurefile-csi"   # Azure ARO
  #   - "standard-rwx"    # GCP Filestore / ODF
  #   - "ontap-nas"       # NetApp Astra Trident
  resources:
    requests:
      storage: 5Gi
